# 정적 파일 서빙 + 백엔드 리버스 프록시. /etc/nginx/conf.d/default.conf 로 들어간다.
#
# **업스트림 이름은 backend 다.** nginx 는 기동할 때 proxy_pass 의 호스트명을 한 번
# 풀고, 못 풀면 "host not found in upstream" 으로 죽는다 — 백엔드가 늦게 뜨는 게
# 아니라 **이름이 없으면** 프론트 컨테이너 자체가 안 뜬다. 같은 네트워크에 그
# 이름(컨테이너 이름이나 --network-alias, compose 의 서비스 이름)이 있어야 한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 백엔드로 넘길 경로. **app/main.py 의 include_router 를 보고 적었다**:
    #   health.router   /health
    #   analyze.router  /analyze
    #   chat.router     /chat · /chat/{id} · /chat/{id}/file · /chat/{id}/index
    #   admin.router    /admin · /admin/{페이지} · /admin/api/* · /admin/admin.css
    #
    # `(/|$)` 로 경계를 박는다. 없으면 /chatbot 같은 프론트 경로까지 백엔드로 샌다.
    #
    # **admin.root_router 의 "/" 는 여기 없다.** 그건 /admin 으로 보내는 리다이렉트인데,
    # 이 구성에서 "/" 는 사용자 화면이다. 관리자 페이지는 /admin 을 직접 친다.
    #
    # 정규식 location 은 접두어 location(/ 와 /assets/)보다 먼저 잡히므로,
    # 아래 블록들과 순서를 다투지 않는다.
    location ~ ^/(analyze|chat|admin|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 백엔드의 IP 단위 남용 제한이 읽는 헤더다. 다만 **TRUST_PROXY_HEADERS=1**
        # 일 때만 읽는다 — 안 켜면 모든 요청이 nginx 컨테이너 IP 하나로 보여
        # 상한이 전체 사용자 공유가 된다 (config.py 주석 참조).
        #
        # **$proxy_add_x_forwarded_for 가 아니라 $remote_addr 다.** 앞엣것은 클라이언트가
        # 보낸 X-Forwarded-For 뒤에 실제 IP 를 **덧붙이는데**, rate_limit.client_ip() 는
        # 맨 앞 항목을 클라이언트로 읽는다 — 헤더를 지어내 넣으면 IP 상한이 그냥 뚫린다.
        # 이 nginx 가 유일한 입구이므로 클라이언트가 보낸 값은 버리고 실제 peer 로 덮는다.
        # (앞에 CDN·LB 를 두게 되면 그때 신뢰 경계를 다시 정할 것 — 7단계)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **기본 60초로는 끊긴다.** 채팅은 tool use 로 검색·파일읽기를 돌고 오느라
        # 10초를 넘고, /analyze 는 GitHub 수집 + 린터 4종 + 요약까지 해서 더 걸린다.
        # 끊기면 브라우저에는 504 만 남고 백엔드는 계속 돌아 LLM 비용은 그대로 나간다.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 이름에 내용 해시가 박힌 파일들(index-D6OOfPtw.js). 내용이 바뀌면 이름이 바뀌므로
    # 오래 캐시해도 낡은 것을 잡을 수 없다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # **index.html 은 캐시하지 않는다.** 새 배포의 자산 해시를 여기서 읽으므로,
    # 이게 캐시되면 브라우저가 옛 번들을 계속 부른다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 폴백. 없는 경로는 404 대신 앱을 준다 — 새로고침·주소 직접 입력에서 깨지지 않는다.
    # 마지막 인자는 내부 리다이렉트라 위의 `= /index.html` 로 다시 들어간다(no-store 가 붙는다).
    location / {
        try_files $uri /index.html;
    }
}
